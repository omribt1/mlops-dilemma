# Minimal auto-mode definition: pick a model and describe your traffic in a few numbers.
# dilemma auto -c examples/auto.yaml
name: quick-check
project: my-gcp-project
region: us-central1

model:
  model_garden_id: google/gemma4@gemma-4-26b-a4b-it
  hf_id: google/gemma-4-26b-a4b-it

traffic:
  peak_input_tps: 200000
  average_input_tps: 60000
